<!DOCTYPE html>
<html lang="en">

  <script>
    function login() {

      const password = document.getElementById("password").value;

      if (username === "ronav" && password === "ballershub123") {
        window.location.href = "admin.html";

        alert("Invalid credentials!");
      }
    }
  </script>
