<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>School Fair Directory</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f0f4f8;
}

header{
background:#2196F3;
color:white;
text-align:center;
padding:25px;
}

.page{
padding:20px;
}

.hidden{
display:none;
}

input{
width:100%;
padding:12px;
margin:8px 0;
border-radius:10px;
border:1px solid #ccc;
}

button{
padding:12px 18px;
border:none;
border-radius:10px;
cursor:pointer;
margin:5px;
color:white;
}

.blue{
background:#2196F3;
}

.green{
background:#4CAF50;
}

.orange{
background:#FF9800;
}

.red{
background:#F44336;
}

.purple{
background:#9C27B0;
}

#peopleGrid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
gap:20px;
margin-top:20px;
}

.card{
background:white;
border-radius:15px;
overflow:hidden;
box-shadow:0 2px 10px rgba(0,0,0,.2);
cursor:pointer;
transition:.3s;
}

.card:hover{
transform:scale(1.03);
}

.card img{
width:100%;
height:200px;
object-fit:cover;
}

.card h3{
padding:15px;
text-align:center;
}

.profile{
background:white;
max-width:700px;
margin:auto;
padding:20px;
border-radius:15px;
box-shadow:0 2px 10px rgba(0,0,0,.2);
}

.profile img{
width:100%;
height:350px;
object-fit:cover;
border-radius:12px;
}

.actions{
margin-top:15px;
display:flex;
flex-wrap:wrap;
gap:10px;
}

</style>
</head>

<body>

<header>
<h1>🏫 School Fair Directory</h1>
</header>

<div id="homePage" class="page">

<input
type="text"
id="search"
placeholder="🔍 Search Person"
onkeyup="renderPeople()">

<button
class="blue"
onclick="showAddPage()">
➕ Add Person
</button>

<div id="peopleGrid"></div>

</div>

<div id="addPage"
class="page hidden">

<h2>Add Person</h2>

<input
type="text"
id="name"
placeholder="Full Name">

<input
type="text"
id="address"
placeholder="Address">

<input
type="tel"
id="phone"
placeholder="Phone Number">

<input
type="email"
id="email"
placeholder="Email Address">

<input
type="file"
id="image"
accept="image/*">

<button
class="green"
onclick="savePerson()">
💾 Save
</button>

<button
class="red"
onclick="goHome()">
❌ Cancel
</button>

</div>

<div
id="profilePage"
class="page hidden">
</div>

<script>

let people =
JSON.parse(
localStorage.getItem("people")
) || [];

function saveData(){

localStorage.setItem(
"people",
JSON.stringify(people)
);

}

function showAddPage(){

homePage.classList.add("hidden");

addPage.classList.remove("hidden");

profilePage.classList.add("hidden");

}

function goHome(){

homePage.classList.remove("hidden");

addPage.classList.add("hidden");

profilePage.classList.add("hidden");

renderPeople();

}
function savePerson(){

const name =
document.getElementById("name").value;

const address =
document.getElementById("address").value;

const phone =
document.getElementById("phone").value;

const email =
document.getElementById("email").value;

const image =
document.getElementById("image").files[0];

if(
!name ||
!address ||
!phone ||
!email ||
!image
){
alert("Please fill all fields");
return;
}

const reader =
new FileReader();

reader.onload =
function(e){

people.push({

name:name,
address:address,
phone:phone,
email:email,
image:e.target.result

});

saveData();

document.getElementById("name").value="";
document.getElementById("address").value="";
document.getElementById("phone").value="";
document.getElementById("email").value="";
document.getElementById("image").value="";

goHome();

};

reader.readAsDataURL(image);

}

function renderPeople(){

const search =
document
.getElementById("search")
.value
.toLowerCase();

const grid =
document.getElementById("peopleGrid");

grid.innerHTML = "";

people.forEach(
(person,index)=>{

if(
!person.name
.toLowerCase()
.includes(search)
){
return;
}

grid.innerHTML +=

`

<div
class="card"
onclick="openProfile(${index})">

<img
src="${person.image}">

<h3>
${person.name}
</h3>

</div>

`;

});

}
function openProfile(index){

const p =
people[index];

homePage.classList.add("hidden");

addPage.classList.add("hidden");

profilePage.classList.remove("hidden");

profilePage.innerHTML = `

<div class="profile">

<img src="${p.image}">

<h2>${p.name}</h2>

<br>

<p>
<b>📍 Address:</b>
${p.address}
</p>

<br>

<p>
<b>📞 Phone:</b>
${p.phone}
</p>

<br>

<p>
<b>📧 Email:</b>
${p.email}
</p>

<div class="actions">

<button
class="green"
onclick="openMaps(${index})">
📍 Maps
</button>

<button
class="orange"
onclick="callPerson('${p.phone}')">
📞 Call
</button>

<button
class="purple"
onclick="emailPerson('${p.email}')">
📧 Email
</button>

<button
class="blue"
onclick="editPerson(${index})">
✏️ Edit
</button>

<button
class="red"
onclick="deletePerson(${index})">
🗑 Delete
</button>

<button
class="blue"
onclick="goHome()">
⬅ Back
</button>

</div>

</div>

`;

}

function openMaps(index){

window.open(
"https://www.google.com/maps/search/?api=1&query=" +
encodeURIComponent(
people[index].address
),
"_blank"
);

}

function callPerson(phone){

window.location.href =
"tel:" + phone;

}

function emailPerson(email){

window.location.href =
"mailto:" + email;

}
function editPerson(index){

let newName =
prompt(
"Edit Name",
people[index].name
);

if(newName === null) return;

let newAddress =
prompt(
"Edit Address",
people[index].address
);

if(newAddress === null) return;

let newPhone =
prompt(
"Edit Phone Number",
people[index].phone
);

if(newPhone === null) return;

let newEmail =
prompt(
"Edit Email",
people[index].email
);

if(newEmail === null) return;

people[index].name =
newName;

people[index].address =
newAddress;

people[index].phone =
newPhone;

people[index].email =
newEmail;

saveData();

openProfile(index);

}

function deletePerson(index){

if(
confirm(
"Delete this person?"
)
){

people.splice(index,1);

saveData();

goHome();

}

}

renderPeople();

</script>

</body>
</html>
