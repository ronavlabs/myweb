<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>People Directory Pro</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f6f9;
transition:0.3s;
}

body.dark{
background:#121212;
color:white;
}

header{
background:#2196F3;
color:white;
padding:20px;
text-align:center;
}

.page{
padding:20px;
}

.hidden{
display:none;
}

input{
width:100%;
padding:12px;
margin:8px 0;
border-radius:8px;
border:1px solid #ccc;
}

.btn{
padding:12px 18px;
border:none;
border-radius:8px;
cursor:pointer;
color:white;
margin:5px;
}

.blue{
background:#2196F3;
}

.green{
background:#4CAF50;
}

.orange{
background:#FF9800;
}

.red{
background:#F44336;
}

.purple{
background:#9C27B0;
}

#peopleGrid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-top:20px;
}

.card{
background:white;
border-radius:15px;
overflow:hidden;
box-shadow:0 2px 10px rgba(0,0,0,.2);
cursor:pointer;
transition:0.3s;
}

.dark .card{
background:#1e1e1e;
color:white;
}

.card:hover{
transform:scale(1.03);
}

.card img{
width:100%;
height:180px;
object-fit:cover;
}

.card h3{
padding:15px;
text-align:center;
}

.profile{
max-width:700px;
margin:auto;
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 2px 10px rgba(0,0,0,.2);
}

.dark .profile{
background:#1e1e1e;
color:white;
}

.profile img{
width:100%;
height:350px;
object-fit:cover;
border-radius:12px;
}

.actions{
margin-top:20px;
display:flex;
flex-wrap:wrap;
gap:10px;
}

h2{
margin-bottom:15px;
}

</style>
</head>

<body>

<header>
<h1>🏠 People Directory Pro</h1>

<button class="btn purple"
onclick="toggleDarkMode()">
🌙 Dark Mode
</button>

</header>

<div id="homePage" class="page">

<input
type="text"
id="search"
placeholder="🔍 Search people..."
onkeyup="renderPeople()">

<button
class="btn blue"
onclick="showAddPage()">
➕ Add Person
</button>

<div id="peopleGrid"></div>

</div>

<div id="addPage"
class="page hidden">

<h2>Add Person</h2>

<input
type="text"
id="name"
placeholder="Name">

<input
type="text"
id="address"
placeholder="Address">

<input
type="tel"
id="phone"
placeholder="Phone Number">

<input
type="email"
id="email"
placeholder="Email Address">

<input
type="file"
id="image"
accept="image/*">

<button
class="btn green"
onclick="savePerson()">
💾 Save
</button>

<button
class="btn red"
onclick="goHome()">
❌ Cancel
</button>

</div>

<div id="profilePage"
class="page hidden"></div>

<script>

let people =
JSON.parse(
localStorage.getItem("people")
) || [];

if(
localStorage.getItem("darkMode")
==="true"
){
document.body.classList.add("dark");
}

function saveData(){

localStorage.setItem(
"people",
JSON.stringify(people)
);

}

function toggleDarkMode(){

document.body.classList.toggle("dark");

localStorage.setItem(
"darkMode",
document.body.classList.contains("dark")
);

}

function goHome(){

document.getElementById("homePage")
.classList.remove("hidden");

document.getElementById("addPage")
.classList.add("hidden");

document.getElementById("profilePage")
.classList.add("hidden");

renderPeople();

}

function showAddPage(){

document.getElementById("homePage")
.classList.add("hidden");

document.getElementById("addPage")
.classList.remove("hidden");

document.getElementById("profilePage")
.classList.add("hidden");

}

function savePerson(){

const name =
document.getElementById("name").value;

const address =
document.getElementById("address").value;

const phone =
document.getElementById("phone").value;

const email =
document.getElementById("email").value;

const image =
document.getElementById("image")
.files[0];

if(
!name ||
!address ||
!phone ||
!email ||
!image
){
alert("Fill all fields");
return;
}

const reader =
new FileReader();

reader.onload =
function(e){

people.push({

name:name,
address:address,
phone:phone,
email:email,
image:e.target.result

});

saveData();

goHome();

};

reader.readAsDataURL(image);

}
function renderPeople(){

const grid =
document.getElementById("peopleGrid");

const search =
document.getElementById("search")
.value.toLowerCase();

grid.innerHTML="";

people.forEach((person,index)=>{

if(
!person.name
.toLowerCase()
.includes(search)
){
return;
}

grid.innerHTML += `

<div
class="card"
onclick="openProfile(${index})">

<img src="${person.image}">

<h3>${person.name}</h3>

</div>

`;

});

}

function openProfile(index){

const p = people[index];

document.getElementById("homePage")
.classList.add("hidden");

document.getElementById("addPage")
.classList.add("hidden");

document.getElementById("profilePage")
.classList.remove("hidden");

document.getElementById("profilePage")
.innerHTML = `

<div class="profile">

<img src="${p.image}">

<h2>${p.name}</h2>

<br>

<p>
<b>📍 Address:</b>
${p.address}
</p>

<br>

<p>
<b>📞 Phone:</b>
${p.phone}
</p>

<br>

<p>
<b>📧 Email:</b>
${p.email}
</p>

<div class="actions">

<button
class="btn green"
onclick="window.open(
'https://www.google.com/maps/search/?api=1&query='
+ encodeURIComponent('${p.address}')
)">
📍 Maps
</button>

<a href="tel:${p.phone}">
<button class="btn orange">
📞 Call
</button>
</a>

<a href="mailto:${p.email}">
<button class="btn purple">
📧 Email
</button>
</a>

<button
class="btn blue"
onclick="editPerson(${index})">
✏️ Edit
</button>

<button
class="btn red"
onclick="deletePerson(${index})">
🗑 Delete
</button>

<button
class="btn blue"
onclick="goHome()">
⬅ Back
</button>

</div>

</div>

`;

}

function editPerson(index){

let newName =
prompt(
"Edit Name",
people[index].name
);

if(newName===null) return;

let newAddress =
prompt(
"Edit Address",
people[index].address
);

if(newAddress===null) return;

let newPhone =
prompt(
"Edit Phone",
people[index].phone
);

if(newPhone===null) return;

let newEmail =
prompt(
"Edit Email",
people[index].email
);

if(newEmail===null) return;

people[index].name =
newName;

people[index].address =
newAddress;

people[index].phone =
newPhone;

people[index].email =
newEmail;

saveData();

openProfile(index);

}

function deletePerson(index){

if(
confirm(
"Delete this person?"
)
){

people.splice(index,1);

saveData();

goHome();

}

}

renderPeople();

</script>

</body>
</html>
